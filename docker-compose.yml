services:
  config-server:
    build: .
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-config-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD in .env}
    volumes:
      - ../config-store:/config:ro
