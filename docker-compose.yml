services:
  config-server:
    build: .
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      RQE_CONFIGSRV_USERNAME: ${RQE_CONFIGSRV_USERNAME:-config-admin}
      RQE_CONFIGSRV_PASSWORD: ${RQE_CONFIGSRV_PASSWORD:?set RQE_CONFIGSRV_PASSWORD in .env}
    volumes:
      - ../config-store:/config:ro
